<h2>Munin Monitoring</h2>

<p>Opening Munin in a new tab... You may need to allow pop-ups for this site.</p>

<p><a href="#" onclick="event.preventDefault(); munin_open_direct();">Open Munin again</a></p>

<p>Munin's alerts are set under <a href="#notifications">System &gt; Notifications</a>.</p>

<script>
// The menu entry "Munin Monitoring" opens Munin directly (munin_open_direct);
// this page is only shown for the address #munin (an old bookmark).

function show_munin() {
  munin_open_direct();
}

function munin_open_direct() {
  // The tab is opened right in the click, so that pop-up blockers let it
  // through; it gets Munin's address once the cookie is set.
  var w = window.open("", "_blank");
  api(
    "/munin",
    "GET",
    { },
    function(r) {
      if (w && !w.closed)
        w.location = "/admin/munin/index.html";
      else
        window.open("/admin/munin/index.html", "_blank");
    },
    function(text, xhr) {
      if (w && !w.closed) w.close();
      if (xhr && xhr.status == 403) return; // handled by api()
      show_modal_error("Munin Monitoring", $("<p></p>").text(text || "Munin could not be opened."));
    });
}
</script>
