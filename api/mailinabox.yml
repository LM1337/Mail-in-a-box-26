            network:
              type: string
              nullable: true
    Fail2banSettingsResponse:
      type: object
      required:
        - settings
        - defaults
        - warnings
      properties:
        settings:
          $ref: '#/components/schemas/Fail2banSettings'
        defaults:
          $ref: '#/components/schemas/Fail2banSettings'
        warnings:
          type: array
          items:
            type: string
    Fail2banSettingsUpdateResponse:
      type: object
      required:
        - status
        - settings
        - changed
      properties:
        status:
          type: string
          example: ok
        settings:
          $ref: '#/components/schemas/Fail2banSettings'
        changed:
          type: boolean
          description: The jail files changed.
        reloaded:
          type: boolean
        restarted:
          type: boolean
        skipped_jails:
          type: array
          items:
            type: string
        unbanned_allowlisted:
          type: array
          items:
            type: string
    Fail2banUnbanResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        ip:
          type: string
        jail:
          type: string
          nullable: true
        unbanned_from:
          type: array
          items:
            type: string
        still_banned_in:
          type: array
          items:
            type: string
        history_deleted:
          type: boolean
    Fail2banReportResponse:
      type: object
      required:
        - failures
        - distinct_ips
        - scan_hours
        - flagged_accounts
        - persistent_total
      properties:
        scan_hours:
          type: integer
        account_hours:
          type: integer
        spray_min_ips:
          type: integer
        persistent_min_failures:
          type: integer
        persistent_min_hours:
          type: integer
        failures:
          type: integer
        distinct_ips:
          type: integer
        accounts:
          type: array
          items:
            type: object
        flagged_accounts:
          type: array
          items:
            type: string
        unknown_accounts:
          type: array
          items:
            type: object
        persistent_ips:
          type: array
          items:
            type: object
        persistent_total:
          type: integer
        banned_devices:
          type: array
          items:
            type: object
        seconds:
          type: number
    MuninAlertsRecipient:
      type: string
      enum:
        - admin
        - custom
        - 'off'
      description: |
        `admin`: administrator@ of the box's name (the default), `custom`: the
        address in `address`, `off`: no alerts.
    MuninAlertsLevel:
      type: string
      enum:
        - warning
        - critical
      description: |
        `warning`: warnings and critical values (the default), `critical`:
        only critical values.
    MuninAlertsResponse:
      type: object
      required:
        - recipient
        - address
        - level
        - default_address
        - to
        - config_current
        - warnings
      properties:
        recipient:
          $ref: '#/components/schemas/MuninAlertsRecipient'
        address:
          type: string
          description: The custom address, empty unless `recipient` is `custom`.
        level:
          $ref: '#/components/schemas/MuninAlertsLevel'
        default_address:
          $ref: '#/components/schemas/Email'
        to:
          type: string
          nullable: true
          description: The address the alerts go to, null when they are off.
        config_current:
          type: boolean
          description: /etc/munin/munin.conf matches the setting.
        warnings:
          type: array
          items:
            type: string
          description: A stored value was invalid and the defaults are used.
    MuninAlertsUpdateRequest:
      type: object
      properties:
        recipient:
          $ref: '#/components/schemas/MuninAlertsRecipient'
        address:
          type: string
        level:
          $ref: '#/components/schemas/MuninAlertsLevel'
    MuninAlertsUpdateResponse:
      allOf:
        - $ref: '#/components/schemas/MuninAlertsResponse'
        - type: object
          required:
            - status
            - changed
          properties:
            status:
              type: string
              example: ok
            changed:
              type: boolean
              description: /etc/munin/munin.conf was written.
    LogoutResponse:
      type: object
      properties:
        status:
          type: string
