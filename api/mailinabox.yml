      description: Retrieves which type of MFA is used and configuration
      operationId: mfaStatus
      x-codeSamples:
        - lang: curl
          source: |
            curl -X POST "https://{host}/admin/mfa/status" \
              -u "<email>:<password>"
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatusResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
  /mfa/totp/enable:
    post:
      tags:
        - MFA
      summary: Enable TOTP authentication
      description: Enables TOTP authentication for the currently logged-in admin user
      operationId: mfaTotpEnable
      x-codeSamples:
        - lang: curl
          source: |
            curl -X POST "https://{host}/admin/mfa/totp/enable" \
              -d "code=123456" \
              -d "secret=<string>" \
              -u "<email>:<password>"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaEnableRequest'
      responses:
        200:
          description: Successful operation
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/MfaEnableSuccessResponse'
        400:
          description: Bad request
          content:
            text/html:
              schema:
                type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
  /mfa/disable:
    post:
      tags:
        - MFA
      summary: Disable multi-factor authentication for you or another user
      description: Disables multi-factor authentication for the currently logged-in admin user or another user if a 'user' parameter is submitted. Either disables all multi-factor authentication methods or the method corresponding to the optional property `mfa_id`.
      operationId: mfaTotpDisable
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
      x-codeSamples:
        - lang: curl
          source: |
            curl -X POST "https://{host}/admin/mfa/totp/disable" \
              -u "<email>:<user_key>"
      responses:
        200:
          description: Successful operation
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/MfaDisableSuccessResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
  /mail/users/quota:
    get:
      tags:
        - Mail
      summary: Get the quota of a mail user
      description: |
        Returns the quota of an existing mail user (`0`: no quota), as JSON, or
        as plain text when the parameter `text` is given.
      operationId: getMailUserQuota
      parameters:
        - in: query
          name: email
          required: true
          schema:
            $ref: '#/components/schemas/Email'
          description: The user's email address.
        - in: query
          name: text
          required: false
          schema:
            type: string
          description: Any non-empty value returns the quota as plain text.
      x-codeSamples:
        - lang: curl
          source: |
            curl -X GET "https://{host}/admin/mail/users/quota?email=<email>" \
              -u "<email>:<password>"
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailUserQuotaResponse'
            text/html:
              schema:
                type: string
              example: 10G
        400:
          description: Not a user
          content:
            text/html:
              schema:
                type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Mail
      summary: Set the quota of a mail user
      description: |
        Sets the quota of an existing mail user: a number of bytes, or with the
        unit `M` or `G`; `0` for no quota.
      operationId: setMailUserQuota
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MailUserSetQuotaRequest'
            example:
              email: user@example.com
              quota: 10G
      x-codeSamples:
        - lang: curl
          source: |
            curl -X POST "https://{host}/admin/mail/users/quota" \
              -d "email=<email>" \
              -d "quota=<quota>" \
              -u "<email>:<password>"
      responses:
        200:
          description: Successful operation
          content:
            text/html:
              schema:
                type: string
              example: OK
        400:
          description: Bad request (not a user, invalid quota)
          content:
            text/html:
              schema:
                type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
  /system/fail2ban:
    get:
      tags:
        - System
      summary: Get the status of the intrusion protection
      description: |
        Returns the status of fail2ban (fork: adaptive fail2ban): its jails with
        their counters and current bans, the settings, their defaults and
        limits, whether the written jail files match the settings, and the
        address of the calling client (for the allowlist hint of the control
        panel). With fail2ban not running, `running` is false and `error` says
        why.
      operationId: getFail2banStatus
      x-codeSamples:
        - lang: curl
          source: |
            curl -X GET "https://{host}/admin/system/fail2ban" \
              -u "<email>:<password>"
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fail2banStatusResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
  /system/fail2ban/settings:
    get:
      tags:
        - System
      summary: Get the intrusion protection settings
      description: Returns the settings of the adaptive fail2ban, their defaults and warnings about stored values that were replaced.
      operationId: getFail2banSettings
      x-codeSamples:
        - lang: curl
          source: |
            curl -X GET "https://{host}/admin/system/fail2ban/settings" \
              -u "<email>:<password>"
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fail2banSettingsResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - System
      summary: Change the intrusion protection settings
      description: |
        Form fields named like the settings (`adaptive`, `bantime_max`,
        `memory`, `slow_jails`, `slow_web_jails`, `slow_maxretry`,
        `slow_findtime`, `slow_bantime`, `allowlist`, `spray_min_ips`); fields
        that are not sent keep their value, `reset=1` starts from the defaults.
        Durations in seconds or with a unit (`30m`, `6h`, `2d`, `1w`), booleans
        as `1`/`0`, the allowlist as addresses or networks separated by spaces,
        commas or line breaks. The jail files are written and fail2ban is
        reloaded when they change; on an error nothing is changed.
      operationId: setFail2banSettings
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: string
            example:
              spray_min_ips: '20'
      x-codeSamples:
        - lang: curl
          source: |
            curl -X POST "https://{host}/admin/system/fail2ban/settings" \
              -d "allowlist=192.0.2.0/24" \
              -u "<email>:<password>"
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fail2banSettingsUpdateResponse'
        400:
          description: Invalid value (nothing was changed)
          content:
            text/html:
              schema:
                type: string
        500:
          description: fail2ban could not apply the configuration (the previous one was restored)
          content:
            text/html:
              schema:
                type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
  /system/fail2ban/unban:
    post:
      tags:
        - System
      summary: Unban an address
      description: |
        Unbans `ip` in `jail`, or without a jail in all jails (recidive
        included) and deletes its ban history.
      operationId: fail2banUnban
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - ip
              properties:
                ip:
                  type: string
                jail:
                  type: string
            example:
              ip: 192.0.2.5
      x-codeSamples:
        - lang: curl
          source: |
            curl -X POST "https://{host}/admin/system/fail2ban/unban" \
              -d "ip=<address>" \
              -u "<email>:<password>"
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fail2banUnbanResponse'
        400:
          description: Not an address, or no such jail
          content:
            text/html:
              schema:
                type: string
        500:
          description: fail2ban failed
          content:
            text/html:
              schema:
                type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
  /system/fail2ban/unban-all:
    post:
      tags:
        - System
      summary: Unban all addresses of a jail
      description: Unbans all addresses that `jail` bans.
      operationId: fail2banUnbanAll
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - jail
              properties:
                jail:
                  type: string
            example:
              jail: miab-slow-smtp
      x-codeSamples:
        - lang: curl
          source: |
            curl -X POST "https://{host}/admin/system/fail2ban/unban-all" \
              -d "jail=<jail>" \
              -u "<email>:<password>"
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  jail:
                    type: string
                  unbanned:
                    type: integer
        400:
          description: No such jail
          content:
            text/html:
              schema:
                type: string
        500:
          description: fail2ban failed
          content:
            text/html:
              schema:
                type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
  /system/fail2ban/report:
    get:
      tags:
        - System
      summary: Get the report of failed logins
      description: |
        Reads the failed logins of the last hours from the logs: accounts that
        fail from many addresses (password spraying), addresses that keep
        failing below the ban threshold, and banned addresses that also log in
        successfully (devices with an old password).
      operationId: getFail2banReport
      x-codeSamples:
        - lang: curl
          source: |
            curl -X GET "https://{host}/admin/system/fail2ban/report" \
              -u "<email>:<password>"
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fail2banReportResponse'
        500:
          description: The logs could not be read
          content:
            text/html:
              schema:
                type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
  /system/munin/alerts:
    get:
      tags:
        - System
      summary: Get the setting of Munin's alerts
      description: |
        Returns who gets Munin's alert mails (`recipient`: `admin` for
        administrator@ of the box's name, `custom` for `address`, `off`), the
        level (`warning`: warnings and critical values, `critical`: only
        critical values), the resulting address `to` (null when off), and
        whether `/etc/munin/munin.conf` matches the setting.
      operationId: getMuninAlerts
      x-codeSamples:
        - lang: curl
          source: |
            curl -X GET "https://{host}/admin/system/munin/alerts" \
              -u "<email>:<password>"
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuninAlertsResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - System
      summary: Change the setting of Munin's alerts
      description: |
        Form fields `recipient` (`admin`, `custom`, `off`), `address` (for
        `custom`: a plain address, ASCII letters, digits and `_ + - .` before
        the @, no name or quotes) and `level` (`warning`, `critical`); fields
        that are not sent keep their value, except `address`: it is cleared
        unless `recipient` is `custom`, so send it again when switching back
        to `custom`. Writes `/etc/munin/munin.conf`;
        Munin reads it on its next run.
      operationId: setMuninAlerts
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MuninAlertsUpdateRequest'
            examples:
              custom:
                summary: Critical values to another address
                value:
                  recipient: custom
                  address: ops@example.com
                  level: critical
              off:
                summary: No alerts
                value:
                  recipient: 'off'
      x-codeSamples:
        - lang: curl
          source: |
            curl -X POST "https://{host}/admin/system/munin/alerts" \
              -d "recipient=custom" \
              -d "address=<email>" \
              -d "level=warning" \
              -u "<email>:<password>"
      responses:
        200:
          description: Successful operation (the new setting)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuninAlertsUpdateResponse'
        400:
          description: Invalid value (nothing was changed)
          content:
            text/html:
              schema:
                type: string
        500:
          description: munin.conf could not be written (the previous setting was restored)
          content:
            text/html:
              schema:
                type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
  /system/munin/alerts/test:
    post:
      tags:
        - System
      summary: Send a test alert
      description: |
        Sends one test notification to the saved recipient, through the same
        command as Munin's alerts (as user munin). Its subject is "Munin test
        notification" and it has the header `X-Miab-Test: 1`.
      operationId: testMuninAlerts
      x-codeSamples:
        - lang: curl
          source: |
            curl -X POST "https://{host}/admin/system/munin/alerts/test" \
              -u "<email>:<password>"
      responses:
        200:
          description: The mail was handed to Postfix
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - to
                properties:
                  status:
                    type: string
                    example: ok
                  to:
                    $ref: '#/components/schemas/Email'
        400:
          description: The alerts are off
          content:
            text/html:
              schema:
                type: string
        500:
          description: The mail could not be sent
          content:
            text/html:
              schema:
                type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
  /munin/:
    get:
      tags:
        - System
      summary: Start a Munin session
      description: |
        Sets the cookie `session` (30 minutes, HttpOnly, Secure, SameSite
        Strict) that gives access to Munin's pages under `/admin/munin/`.
        Those pages and graphs are not part of this API.
      operationId: startMunin
      x-codeSamples:
        - lang: curl
          source: |
            curl -X GET "https://{host}/admin/munin/" -c cookies.txt \
              -u "<email>:<password>"
      responses:
        200:
          description: Successful operation
          content:
            text/html:
              schema:
                type: string
              example: OK
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Credentials can be supplied using the `Authorization` header in
        format `Authorization: Basic {access-token}`.

        The `access-token` is comprised of the Base64 encoding of `username:password`.
        The `username` is the mail user's email address, and `password` can either be the mail user's
        password, or the `api_key` returned from the `login` operation.

        When using `curl`, you can supply user credentials using the `-u` or `--user` parameter.
  responses:
    Unauthorized:
      description: |
        No credentials, wrong credentials, or not an administrator. The header
        `X-Reason` and the body give the reason, as plain text when the request
        has no `Accept` header or `Accept: */*`, as JSON otherwise. The answer
        has a `WWW-Authenticate` header. Each request with wrong credentials is
        logged as a failed login, which fail2ban counts (jail
        `miab-management`).
      content:
        text/plain:
          schema:
            type: string
            example: Incorrect username or password
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    Forbidden:
      description: |
        As 401, for requests with the header `X-Requested-With: XMLHttpRequest`
        (as the control panel sends them), so that the browser does not ask
        for a password. No `WWW-Authenticate` and no `X-Reason` header.
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
  requestBodies:
    DNSCustomRecordRequest:
      required: true
      content:
        text/plain:
          schema:
            type: string
            example: '1.2.3.4'
            description: The value of the DNS record.
          example: '1.2.3.4'
  schemas:
    MailUsersResponseFormat:
      type: string
      enum:
        - text
        - json
      example: json
      description: Response format (`application/json` or `text/html`).
    MailAliasesResponseFormat:
      type: string
      enum:
        - text
        - json
      example: json
      description: Response format (`application/json` or `text/html`).
    MailUserSetPasswordResponse:
      type: string
      example: OK
      description: Mail user set password response.
    MailUserRemoveResponse:
      type: string
      example: OK
      description: Mail user remove response.
    MailUserAddResponse:
      type: string
      example: |
        mail user added
        updated DNS: OpenDKIM configuration
      description: |
        Mail user add response.

        Can include information about operations related to adding new users, like updating DNS.
    MailUserAddPrivilegeResponse:
      type: string
      example: OK
      description: Mail user add admin privilege response.
    MailUserRemovePrivilegeResponse:
      type: string
      example: OK
      description: Mail user remove admin privilege response.
    MailUsersSimpleResponse:
      type: string
      example: |
        user1@example.com
        user2@example.com
      description: Get mail users text format response.
    MailUserPrivilegesResponse:
      $ref: '#/components/schemas/MailUserPrivilege'
      description: Mail user privileges response.
      example: admin
    MailDomainsResponse:
      type: string
      example: |
        example1.com
        example2.com
      description: Mail domains response.
    MailUsersResponse:
      type: array
      items:
        $ref: '#/components/schemas/MailUserByDomain'
      description: Get mail aliases JSON format response.
    MailUserByDomain:
      type: object
      required:
        - domain
        - users
      properties:
        domain:
          $ref: '#/components/schemas/Hostname'
        users:
          type: array
          items:
            $ref: '#/components/schemas/MailUser'
      description: Mail users by domain.
    MailUser:
      type: object
      required:
        - email
        - privileges
        - status
      properties:
        email:
          $ref: '#/components/schemas/Email'
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/MailUserPrivilege'
        status:
          $ref: '#/components/schemas/MailUserStatus'
        mailbox:
          type: string
          example: /home/user-data/mail/mailboxes/example.com/user
      description: Mail user details.
    MailAliasesSimpleResponse:
      type: string
      example: |
        abuse@example.com	administrator@example.com
        admin@example.com	administrator@example.com
      description: Get mail aliases text format response.
    MailAliasByDomain:
      type: object
      required:
        - domain
        - aliases
      properties:
        domain:
          $ref: '#/components/schemas/Hostname'
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/MailAlias'
      description: Mail aliases by domain.
    MailAlias:
      type: object
      required:
        - address
        - address_display
        - forwards_to
        - permitted_senders
        - required
      properties:
        address:
          $ref: '#/components/schemas/Email'
        address_display:
          $ref: '#/components/schemas/Email'
        forwards_to:
          type: array
          items:
            $ref: '#/components/schemas/Email'
        permitted_senders:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Email'
        required:
          type: boolean
          example: true
      description: Mail alias details.
    MailAliasUpsertResponse:
      type: string
      example: alias updated
      description: Mail alias add/update response.
    MailAliasUpsertRequest:
      type: object
      required:
        - update_if_exists
        - address
        - forwards_to
        - permitted_senders
      properties:
        update_if_exists:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          example: 1
          description: Set to `1` when updating an alias.
        address:
          $ref: '#/components/schemas/Email'
        forwards_to:
          type: string
          example: user1@example.com, user2@example.com
          description: |
            If adding a regular or catch-all alias, the format needs to be `user@example.com`.
            Multiple address can be separated by newlines or commas.

            If adding a domain alias, the format needs to be `@example.com`.
        permitted_senders:
          type: string
          nullable: true
          example: user1@example.com, user2@example.com
          description: |
            Mail users that can send mail claiming to be from any address on the alias domain.
            Multiple address can be separated by newlines or commas.

            Leave empty to allow any mail user listed in `forwards_to` to send mail claiming to be from any address on the alias domain.
      description: Mail alias upsert request.
    MailAliasRemoveResponse:
      type: string
      example: alias removed
      description: Mail alias remove response.
    MailAliasRemoveRequest:
      type: object
      required:
        - address
      properties:
        address:
          $ref: '#/components/schemas/Email'
      description: Mail aliases remove request.
    DNSRecordType:
      enum:
        - A
        - AAAA
        - CAA
        - CNAME
        - TXT
        - MX
        - SRV
        - SSHFP
        - NS
      example: MX
      description: DNS record type.
    DNSDumpResponse:
      type: array
      items:
        $ref: '#/components/schemas/DNSDumpDomains'
      description: DNS dump response.
    DNSDumpDomains:
      type: array
      items:
        oneOf:
          - $ref: '#/components/schemas/Hostname'
          - $ref: '#/components/schemas/DNSDumpDomainRecords'
      description: |
        A list of records per domain.

        The first item in the list is the domain and the second item is the list of records.
    DNSDumpDomainRecords:
      type: array
      items:
        $ref: '#/components/schemas/DNSDumpDomainRecord'
      description: List of domain records.
    DNSDumpDomainRecord:
      type: object
      required:
        - explanation
        - qname
        - type
        - value
      properties:
        explanation:
          type: string
          example: Required. Specifies the hostname (and priority) of the machine that handles @example.com mail
        qname:
          $ref: '#/components/schemas/Hostname'
        rtype:
          $ref: '#/components/schemas/DNSRecordType'
        value:
          type: string
          example: 10 example.com.
      description: Domain DNS record details.
    DNSCustomRecord:
      type: object
      required:
        - qname
        - rtype
        - value
      properties:
        qname:
          $ref: '#/components/schemas/Hostname'
        rtype:
          $ref: '#/components/schemas/DNSRecordType'
        value:
          type: string
          example: 10 example.com.
      description: Custom DNS record detail detail.
    DNSCustomRecordsResponse:
      type: array
      items:
        $ref: '#/components/schemas/DNSCustomRecord'
