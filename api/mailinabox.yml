          example: This domain"s DNSSEC DS record is not set
        extra:
          type: array
          items:
            $ref: '#/components/schemas/StatusEntryExtra'
      description: System status entry.
    StatusEntryType:
      type: string
      enum:
        - heading
        - ok
        - warning
        - error
      example: warning
      description: System status entry type.
    StatusEntryExtra:
      type: object
      required:
        - monospace
        - text
      properties:
        monospace:
          type: boolean
          example: false
        text:
          type: string
          example: 'Digest Type: 2 / SHA-256'
      description: System entry extra information.
    SystemBackupConfigUpdateRequest:
      type: object
      required:
        - target
        - target_user
        - target_pass
        - min_age
      properties:
        target:
          type: string
          format: hostname
          example: s3://s3.eu-central-1.amazonaws.com/box-example-com
        target_user:
          type: string
          example: username
        target_pass:
          type: string
          example: password
          format: password
        min_age:
          type: integer
          format: int32
          minimum: 1
          example: 3
      description: Backup config update request.
    SystemBackupConfigUpdateResponse:
      type: string
      example: OK
      description: Backup config update response.
    SystemBackupConfigResponse:
      type: object
      required:
        - enc_pw_file
        - file_target_directory
        - min_age_in_days
        - ssh_pub_key
        - target
      properties:
        enc_pw_file:
          type: string
          example: /home/user-data/backup/secret_key.txt
        file_target_directory:
          type: string
          example: /home/user-data/backup/encrypted
        min_age_in_days:
          type: integer
          format: int32
          minimum: 1
          example: 3
        ssh_pub_key:
          type: string
          example: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDb root@box.example.com\n
        target:
          type: string
          format: hostname
          example: s3://s3.eu-central-1.amazonaws.com/box-example-com
        target_user:
          type: string
        target_pass:
          type: string
      description: Backup config response.
    SystemBackupStatusResponse:
      type: object
      required:
        - unmatched_file_size
      properties:
        backups:
          type: array
          items:
            $ref: '#/components/schemas/SystemBackupStatus'
        unmatched_file_size:
          type: integer
          format: int32
          example: 0
        error:
          type: string
          example: Something is wrong with the backup
        in_progress:
          type: string
          description: Only in `/system/backup/status`, when it returns the saved status because a refresh or a backup run is still in progress.
          example: A refresh of the backup status is still in progress.
        saved_time:
          type: number
          description: With `in_progress`, when the returned status was queried (Unix time).
          example: 1793023200.5
        saved_time_str:
          type: string
          description: With `in_progress`, saved_time as text.
          example: 2026-10-26 03:00:12 UTC
      description: Backup status response. Lists the status for all backups.
    SystemBackupSavedStatusResponse:
      type: object
      required:
        - status
        - refreshing
      properties:
        status:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SystemBackupStatusResponse'
        time:
          type: number
          nullable: true
          description: When the saved status was queried (Unix time).
          example: 1793023200.5
        time_str:
          type: string
          nullable: true
          example: 2026-10-26 03:00:12 UTC
        age_seconds:
          type: integer
          nullable: true
          example: 3600
        source:
          type: string
          nullable: true
          enum:
            - backup
            - refresh
            - status checks
        refreshing:
          type: boolean
          description: A refresh or a backup run is in progress.
        running:
          type: object
          nullable: true
          description: Which of the two is in progress, since when.
        refresh:
          type: object
          nullable: true
          description: |
            The result of the last refresh (by, started, started_str,
            finished, seconds, ok, error).
        now:
          type: number
          example: 1793026800.1
      description: Saved backup status response.
    SystemBackupRefreshResponse:
      type: object
      required:
        - started
        - refreshing
      properties:
        started:
          type: boolean
        refreshing:
          type: boolean
      description: Backup status refresh response.
    SystemBackupStatus:
      type: object
      required:
        - date
        - date_delta
        - date_str
        - full
        - size
        - volumes
      properties:
        date:
          type: string
          format: date-time
          example: 20200801T023706Z
        date_delta:
          type: string
          example: 15 hours, 40 minutes
        date_str:
          type: string
          example: 2020-08-01 03:37:06 BST
        deleted_in:
          type: string
          example: approx. 6 days
        full:
          type: boolean
          example: false
        size:
          type: integer
          format: int32
          example: 125332
        volumes:
          type: integer
          format: int32
          example: 1
      description: Backup status details.
    SSLStatusResponse:
      type: object
      required:
        - can_provision
        - status
      properties:
        can_provision:
          type: array
          items:
            type: string
