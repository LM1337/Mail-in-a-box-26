	# The secret of the proxy of /caldav, /carddav and /webdav below, and
	# the X-Forwarded-For that Nextcloud may get ($miab_nc_proxy_secret,
	# $miab_nc_forwarded_for; root's only, written by setup/web.sh, B213).
	# Empty until that file exists, and included by a pattern, which nginx
	# allows to match nothing: the management daemon writes this
	# configuration from the checkout's templates, also when a setup run
	# stopped after the checkout and before setup/web.sh, and nginx must
	# still load it (Nextcloud then sees the proxy's requests as 127.0.0.1).
	set $miab_nc_proxy_secret "";
	set $miab_nc_forwarded_for "";
	include /etc/nginx/miab-nextcloud-proxy.con[f];

	# Control Panel
	# Proxy /admin to our Python based control panel daemon. It is
	# listening on IPv4 only so use an IP address and not 'localhost'.
	location /admin/assets {
		alias /usr/local/lib/mailinabox/vendor/assets;
	}
	rewrite ^/admin$ /admin/;
	rewrite ^/admin/munin$ /admin/munin/ redirect;
	# Webmail's password change (B210) is for Roundcube's driver on
	# 127.0.0.1:10222 only: from the Internet, its limit of failed attempts
	# per account would let anyone block an account's password change.
	location = /admin/me/password {
		return 404;
	}
	location /admin/ {
		proxy_pass http://127.0.0.1:10222/;
		proxy_set_header X-Forwarded-For $remote_addr;
		# As long as gunicorn lets a request run (--timeout 630, setup/management.sh),
		# not nginx's default of 60 s: the status checks and the TLS provisioning
		# can take longer (B125).
		proxy_read_timeout 630s;
		add_header X-Frame-Options "DENY";
		add_header X-Content-Type-Options nosniff;
		add_header Content-Security-Policy "frame-ancestors 'none';";
		# An add_header here replaces all of the server's, so the server's
		# HSTS header is repeated here (management/web_update.py; B180).
		# HSTS HEADER HERE
	}

	# Nextcloud configuration.
	rewrite ^/cloud$ /cloud/ redirect;
	rewrite ^/cloud/$ /cloud/index.php;
	rewrite ^/cloud/(contacts|calendar|files)$ /cloud/index.php/apps/$1/ redirect;
	rewrite ^(/cloud/core/doc/[^\/]+/)$ $1/index.html;
	rewrite ^(/cloud/oc[sm]-provider)/$ $1/index.php redirect;
	location /cloud/ {
		alias /usr/local/lib/owncloud/;
		# Nextcloud 28+ ships ES modules (.mjs) that browsers only run when served with a
		# JavaScript MIME type, but Ubuntu's mime.types has no mjs entry. A types block
		# replaces the inherited map for this location, so include the system map first.
		include /etc/nginx/mime.types;
		types {
			text/javascript mjs;
		}
		location ~ ^/cloud/(build|tests|config|lib|3rdparty|templates|data|README)/ {
			deny all;
		}
		location ~ ^/cloud/(?:\.|autotest|occ|issue|indie|db_|console) {
			deny all;
		}
		# Enable paths for service and cloud federation discovery
		# Resolves warning in Nextcloud Settings panel
		location ~ ^/cloud/(oc[sm]-provider)?/([^/]+\.php)$ {
			index index.php;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME /usr/local/lib/owncloud/$1/$2;
			# See the location of /cloud's PHP below (B213).
			fastcgi_param HTTP_X_FORWARDED_FOR $miab_nc_forwarded_for if_not_empty;
			fastcgi_param HTTP_X_MIAB_NEXTCLOUD_PROXY "" if_not_empty;
			fastcgi_pass php-fpm;
		}
	}
	location ~ ^(/cloud)((?:/ocs)?/[^/]+\.php)(/.*)?$ {
		# note: ~ has precedence over a regular location block
		# Accept URLs like:
		# /cloud/index.php/apps/files/
		# /cloud/index.php/apps/files/ajax/scan.php (it's really index.php; see 6fdef379adfdeac86cc2220209bdf4eb9562268d)
		# /cloud/ocs/v1.php/apps/files_sharing/api/v1 (see #240)
		# /cloud/remote.php/webdav/yourfilehere...
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME /usr/local/lib/owncloud/$2;
		fastcgi_param SCRIPT_NAME $1$2;
		fastcgi_param PATH_INFO $3;
		fastcgi_param MOD_X_ACCEL_REDIRECT_ENABLED on;
		fastcgi_param MOD_X_ACCEL_REDIRECT_PREFIX /owncloud-xaccel;
		# Nextcloud takes the client's address from X-Forwarded-For on a
		# connection from 127.0.0.1 (trusted_proxies, B121). Only the proxy of
		# /caldav, /carddav and /webdav below may pass one: it proves itself
		# with the secret header of /etc/nginx/miab-nextcloud-proxy.conf
		# (root's only, setup/web.sh, included above), and only then does PHP get its
		# X-Forwarded-For (an explicit HTTP_ parameter replaces the request's
		# header, also when it is empty and so not sent). Any other process on
		# the box that sends X-Forwarded-For from 127.0.0.1 is logged as
		# 127.0.0.1, which fail2ban ignores; before, Nextcloud logged it under
		# the address it named, and miab-owncloud banned that (B213). PHP
		# never sees the secret.
		fastcgi_param HTTP_X_FORWARDED_FOR $miab_nc_forwarded_for if_not_empty;
		fastcgi_param HTTP_X_MIAB_NEXTCLOUD_PROXY "" if_not_empty;
		fastcgi_read_timeout 630;
		fastcgi_pass php-fpm;
		client_max_body_size 1G;
		fastcgi_buffers 64 4K;
	}
	location ^~ /owncloud-xaccel/ {
		# This directory is for MOD_X_ACCEL_REDIRECT_ENABLED. Nextcloud sends the full file
		# path on disk as a subdirectory under this virtual path.
		# We must only allow 'internal' redirects within nginx so that the filesystem
		# is not exposed to the world.
		internal;
		alias /;
	}
	# Z-Push doesn't like getting a redirect, and a plain rewrite didn't work either.
	# Properly proxying like this seems to work fine.
	# One prefix location per path, without variables in proxy_pass: nginx
	# then replaces the prefix in the normalized path, escapes the result
	# again and passes the query string. The earlier regex location passed
	# its capture of the decoded path as it was, without the query string: a
	# card name with a space gave 400, an escaped "?" began a query string
	# (a DELETE of a card named "?x.vcf" deleted the whole address book), and
	# "?export" was lost (B130). "^~": nginx checks no regex location for
	# these paths, as the regex location here won over every regex after it
	# (the dotfile deny at the end of nginx-alldomains.conf, which this file
	# is placed before, and those of a custom include): Nextcloud serves the
	# users' own files and cards here, which may be named ".htpasswd",
	# ".gitignore" or ".svn" (see the dotfile deny and #414). Only
	# Roundcube's "~ /mail/config/" in nginx-alldomains.conf came before it;
	# it was unanchored and answered such a path with 403, at the request
	# that this proxy makes to /cloud/remote.php, until it was anchored to
	# "^/mail/config/" (B134).
	location ^~ /caldav {
		proxy_pass https://127.0.0.1/cloud/remote.php/caldav;
		# Nextcloud sees this proxy's address, 127.0.0.1, which is on its
		# brute-force bypass list (setup/nextcloud.sh, B121). Pass the client's
		# own address, replacing whatever the client sent: Nextcloud takes it
		# from connections of 127.0.0.1 (trusted_proxies), so clients on the
		# Internet keep the throttle and the miab-owncloud jail, and Z-Push
		# (which connects from 127.0.0.1) stays 127.0.0.1. Nextcloud would also
		# trust the forwarded host and protocol from 127.0.0.1: drop what the
		# client sent there, so that it sees this request as before.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Host "";
		proxy_set_header X-Forwarded-Proto "";
		# The proof that this proxy passed X-Forwarded-For (see the location
		# of /cloud's PHP above, B213); it replaces what the client sent.
		proxy_set_header X-Miab-Nextcloud-Proxy $miab_nc_proxy_secret;
	}
	location ^~ /carddav {
		proxy_pass https://127.0.0.1/cloud/remote.php/carddav;
		# The same headers as for /caldav (B121, B213).
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Host "";
		proxy_set_header X-Forwarded-Proto "";
		proxy_set_header X-Miab-Nextcloud-Proxy $miab_nc_proxy_secret;
	}
	location ^~ /webdav {
		proxy_pass https://127.0.0.1/cloud/remote.php/webdav;
		# The same headers as for /caldav (B121, B213).
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Host "";
		proxy_set_header X-Forwarded-Proto "";
		proxy_set_header X-Miab-Nextcloud-Proxy $miab_nc_proxy_secret;
	}
	rewrite ^/.well-known/host-meta /cloud/public.php?service=host-meta last;
	rewrite ^/.well-known/host-meta.json /cloud/public.php?service=host-meta-json last;
	rewrite ^/.well-known/carddav /cloud/remote.php/carddav/ redirect;
	rewrite ^/.well-known/caldav /cloud/remote.php/caldav/ redirect;

	# This addresses those service discovery issues mentioned in:
	# https://docs.nextcloud.com/server/23/admin_manual/issues/general_troubleshooting.html#service-discovery
	rewrite ^/.well-known/webfinger /cloud/index.php/.well-known/webfinger redirect;
	rewrite ^/.well-known/nodeinfo /cloud/index.php/.well-known/nodeinfo redirect;

	# ADDITIONAL DIRECTIVES HERE
