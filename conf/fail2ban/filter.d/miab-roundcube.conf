# Fail2Ban filter for failed Roundcube logins, for Mail-in-a-Box.
#
# Roundcube logs "IMAP Error: Login failed for <user> against <host> from
# <ip>. AUTHENTICATE ...". The user name comes from the client, so the line is
# anchored at its start and the greedy ".*" takes the last "against ... from
# <ip>. AUTHENTICATE <mechanism>:", the one Roundcube wrote (fork, B62).
# Before, the lazy ".*?" took the first " from <ip>. AUTHENTICATE", which could
# be part of the user name.

[INCLUDES]

before = common.conf

[Definition]

failregex = ^(?:\[[^\]]*\]:?\s*)?(?:<[^>]*>\s+)?IMAP Error: Login failed for .* against \S+ from <HOST>(?:\(X-Forwarded-For: [^)]*\))?\. AUTHENTICATE [-\w]+: .*$

ignoreregex =
