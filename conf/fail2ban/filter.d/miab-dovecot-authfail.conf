# Fail2Ban filter for the slow Dovecot jail of Mail-in-a-Box (fork, adaptive fail2ban).
#
# The same lines as dovecotimap.conf, but only real authentication failures:
# "no auth attempts" (a client that connects and leaves without logging in,
# e.g. a monitoring check, a TLS probe or a phone dropping a spare connection)
# is not counted. The fast dovecot jail (20 in 30 s) still counts it; a jail
# with a window of hours would ban such clients.
#
# The reason is left out of failregex at its position, not excluded with an
# ignoreregex: ignoreregex searches the whole line, including the user name a
# client chooses, so "user=<a@b (no auth attempts)>" would hide real failures.

[INCLUDES]

before = dovecotimap.conf

[Definition]

_reasons = auth failed|authorization failed|user disabled|tried to use [^,)]+

ignoreregex =
