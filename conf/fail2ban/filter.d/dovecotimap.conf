# Fail2Ban filter Dovecot authentication and pop3/imap/managesieve server
# For Mail-in-a-Box

[INCLUDES]

before = common.conf

[Definition]

_daemon = (auth|dovecot(-auth)?|auth-worker)

# Dovecot 2.4 logs "<proto>-login: Info: Login aborted: <reason> (<details>) (<event reason>): user=<..>, method=.., rip=.., lip=.., ..."
# (Dovecot 2.3 logged "Aborted login|Disconnected (<details>): user=<..>, ..."). Both are matched, lip may be IPv6.
# The user name is logged unescaped (only control characters are stripped), so a client can put
# "x>, rip=<other ip>, lip=y" into it. The greedy user=<.*> therefore takes the last rip= (the one
# Dovecot appends after the user name), and nothing after lip= may contain '>' except a final
# session=<..>. Otherwise a client could get a third-party IP banned.
failregex = ^%(__prefix_line)s(?:pop3|imap|managesieve|submission)-login: (?:Info: )?(?:Login aborted: .*?|(?:Aborted login|Disconnected)(?:: Inactivity)? )\((?:no auth attempts|auth failed|authorization failed|user disabled|tried to use [^,)]+)(?:, \d+ attempts)?(?: in \d+ secs)?\)(?: \(\w+\))?:(?: user=<.*>,)?(?: method=\S+,)? rip=<HOST>, lip=[^,>\s]+[^>]*(?:, session=<[^>\s]+>)?\s*$

ignoreregex =

