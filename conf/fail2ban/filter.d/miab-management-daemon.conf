# Fail2Ban filter Mail-in-a-Box management daemon
#
# Anchored (fork, B62): the failed-login line comes from the daemon itself
# (start[pid]: with Flask's "[time] WARNING in daemon: " prefix, and once more
# without a tag through /dev/log). /var/log/syslog also gets the Postfix lines,
# where a client-chosen SASL user name or sender address could carry the
# message text with a third party's address; unanchored, that address was
# banned.

[INCLUDES]

before = common.conf

[Definition]

_daemon = (?:start|gunicorn)

failregex = ^%(__prefix_line)s(?:\[[^\]]*\] WARNING in daemon: )?Mail-in-a-Box Management Daemon: Failed login attempt from ip <HOST> - timestamp [\d.]+\s*$
ignoreregex =
