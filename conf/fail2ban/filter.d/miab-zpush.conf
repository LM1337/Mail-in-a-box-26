# Fail2Ban filter for failed ActiveSync and Autodiscover logins (Z-Push), for
# Mail-in-a-Box (fork, B126).
#
# Z-Push checks the password against Dovecot from 127.0.0.1, which the Dovecot
# jails ignore, so only its own log has the client's address. With LOGAUTHFAIL
# (setup/zpush.sh) it writes these warnings to z-push-error.log and
# autodiscover-error.log:
#
#   26/10/2026 13:00:00 [12345] [WARN] [bob@example.com] Failed to authenticate user 'bob@example.com' from IP 192.0.2.1.
#   26/10/2026 13:00:00 [12345] [WARN] [bob@example.com#bob] Failed to authenticate user 'bob@example.com' from IP 192.0.2.1.
#   26/10/2026 13:00:00 [12345] [WARN] [#unknown] Unable to complete autodiscover because login failed for user with email 'bob@example.com' from IP 192.0.2.1.
#
# The first is Z-Push's "IP: <address> failed to authenticate user '<user>'"
# with the address moved to the end by setup/zpush.sh: in Z-Push's own order
# the client chose the text on both sides of the address.
#
# The address is REMOTE_ADDR (USE_CUSTOM_REMOTE_IP_HEADER stays false, so a
# client cannot choose it). The user names and the e-mail address are what the
# client sent, unescaped except for control characters (setup/zpush.sh escapes
# those, so a client cannot start a line of its own). The address is the last
# thing on the line, after everything the client chose: the regexes are
# anchored at the end of the line, so the greedy '.*' takes the last
# " from IP <address>.", the one Z-Push wrote.
# <ADDR> matches an IP address only, never a host name to look up.
#
# Each line starts with the user names in brackets. That is not enough: a
# warning of another kind whose end a client chose could end in the text of a
# failed login. So each regex also ties the message to the brackets before it
# (B126). Z-Push writes "[<user>]" when the user of the login and the user of
# the request (the URL's "User=", lower case) are the same apart from case, and
# "[<user of the login>#<user of the request>]" when they are not;
# setup/zpush.sh has it escape "]" and "\" in them, so the first unescaped "]"
# ends the brackets. The ActiveSync message must name the user of the brackets
# (or the first one of the two), and nothing may stand between the brackets and
# the message. Autodiscover writes its message before Z-Push knows a user: the
# brackets are always "[#unknown]".
#
# A request without a password (a phone asks without credentials first and
# waits for the login prompt) guesses no password: setup/zpush.sh has Z-Push
# write the ActiveSync line only when the request had a user name and a
# password, and Autodiscover logs such a request as an incorrect request. As a
# second guard the filter does not count the user 'unknown', which Z-Push
# logs when a request names no user at all (no name of the box: a login
# needs the full e-mail address).
#
# A login that Dovecot or Nextcloud could not check at that moment (a
# temporary failure) is no failed login: setup/zpush.sh has Z-Push answer it
# with 503, and it writes none of these lines (B126).

[INCLUDES]

before = common.conf

[Definition]

_prefix = ^\s*\[\s*\d+\] \[ ?WARN\]

failregex = %(_prefix)s \[(?P<zpuser>[^\]\\#]*)\] Failed to authenticate user '(?!unknown' from IP )(?i:(?P=zpuser))' from IP <ADDR>\.$
            %(_prefix)s \[(?P<zpauth>[^\]\\#]+)#(?:[^\]\\]|\\.)*\] Failed to authenticate user '(?P=zpauth)' from IP <ADDR>\.$
            %(_prefix)s \[#unknown\] Unable to complete autodiscover because login failed for user with email '.*' from IP <ADDR>\.$

ignoreregex =

# Z-Push's time stamps: local time, day first. Only at the start of the line,
# never a date inside a user name.
datepattern = ^%%d/%%m/%%Y %%H:%%M:%%S
