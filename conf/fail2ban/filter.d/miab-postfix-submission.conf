# Fail2Ban filter for SMTP AUTH failures on the submission ports (465 and 587
# both log as postfix/submission/smtpd), for Mail-in-a-Box.
#
# Anchored like fail2ban's own postfix filter: only the client address right
# after "warning:" can be the host. Postfix appends the client-chosen
# sasl_username after it (", sasl_username=..."), so an unanchored
# ".*\[<HOST>\]" took a "[ip]: " put into the user name and banned a third
# party (fork, B62).

[INCLUDES]

before = common.conf

[Definition]

_daemon = postfix/submission/smtpd

failregex = ^%(__prefix_line)swarning: [-._\w]+\[<HOST>\]: SASL \S+ authentication (?:failed|aborted)

ignoreregex =
