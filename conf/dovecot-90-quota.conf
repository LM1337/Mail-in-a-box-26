# Quota (Dovecot 2.4).
#
# The per-user limit comes from the userdb (users.quota AS quota_storage_size,
# see setup/mail-users.sh). It must stay outside the quota block so that the
# userdb value can override it. 0 means unlimited.
quota_storage_size = 0

# Allow LMTP deliveries to exceed the quota once by this amount. Dovecot 2.3
# took a percentage here (MIAB used 10%); 2.4 only takes a size, so the userdb
# returns 10% of each user's quota as quota_storage_grace (setup/mail-users.sh).
# This default only applies if the userdb does not return a value.
quota_storage_grace = 10M

# The maildir driver keeps writing the Maildir++ "maildirsize" file, which the
# control panel reads to show mailbox usage (management/mailconfig.py).
quota "User quota" {
    quota_driver = maildir
}

# Postfix asks this policy service before accepting a recipient
# (check_policy_service inet:127.0.0.1:12340 in setup/mail-postfix.sh).
# Postfix passes the recipient address *before* alias resolution, so aliases,
# catch-alls and domain aliases are no mailbox in Dovecot's eyes. "success" and
# "nouser" must therefore be DUNNO, which lets Postfix decide; OK or REJECT here
# would accept or bounce mail without the remaining recipient checks.
quota_status_success = DUNNO
quota_status_nouser = DUNNO
quota_status_overquota = "522 5.2.2 Mailbox is full"

service quota-status {
    executable = quota-status -p postfix
    inet_listener quota-status {
        listen = 127.0.0.1
        port = 12340
    }
    client_limit = 1
}
