	# Expose this directory as static files.
	root $ROOT;
	index index.html index.htm;

	location = /robots.txt {
		log_not_found off;
		access_log off;
	}

	location = /favicon.ico {
		log_not_found off;
		access_log off;
		# A favicon.ico in the domain's web root wins; otherwise the fork's icon.
		try_files $uri @mailinabox_favicon;
	}
	location @mailinabox_favicon {
		log_not_found off;
		access_log off;
		root /usr/local/lib/mailinabox/vendor/assets/branding;
		try_files /favicon.ico =404;
	}

	location = /mailinabox.mobileconfig {
		alias /var/lib/mailinabox/mobileconfig.xml;
	}
	location = /.well-known/autoconfig/mail/config-v1.1.xml {
		alias /var/lib/mailinabox/mozilla-autoconfig.xml;
	}
	location = /mail/config-v1.1.xml {
		alias /var/lib/mailinabox/mozilla-autoconfig.xml;
	}
	location = /.well-known/mta-sts.txt {
		alias /var/lib/mailinabox/mta-sts.txt;
	}

	# Roundcube Webmail configuration.
    location = /mail {
        return 301 /mail/;
    }
    location /mail/ {
        alias /usr/local/lib/roundcubemail/public_html/;
        index index.php;
        try_files $uri $uri/ /mail/index.php;

        # Roundcube 1.7 serves all static resources as /mail/static.php/<path>, so split
        # PATH_INFO here instead of relying on PHP-FPM's cgi.fix_pathinfo path guessing.
        location ~ \.php(/|$) {
                include fastcgi_params;
                fastcgi_split_path_info ^/mail(/.+?\.php)(/.*)?$;
                fastcgi_param SCRIPT_FILENAME /usr/local/lib/roundcubemail/public_html/$fastcgi_script_name;
                fastcgi_param PATH_INFO $fastcgi_path_info;
                fastcgi_pass php-fpm;

                # Outgoing mail also goes through this endpoint, so increase the maximum
                # file upload limit to match the corresponding Postfix limit.
                client_max_body_size 128M;
        }
    }

	location ~ /mail/config/.* {
		# Roundcube's config directory is outside public_html anyway; deny it explicitly
		# for any non-PHP request (PHP requests are handled by the nested location above
		# and end in a 404 because there is no such script under public_html).
		return 403;
	}

	# Z-Push (Microsoft Exchange ActiveSync)
	location /Microsoft-Server-ActiveSync {
		include /etc/nginx/fastcgi_params;
		fastcgi_param SCRIPT_FILENAME /usr/local/lib/z-push/index.php;
		fastcgi_param PHP_VALUE "include_path=.:/usr/share/php:/usr/share/pear:/usr/share/awl/inc";
		# A Ping (the push long poll), and a Sync with a wait, answer only
		# after the heartbeat the phone asks for, up to 3540 s (Z-Push's
		# PING_HIGHER_BOUND_LIFETIME, setup/zpush.sh, and the protocol's
		# maximum); iPhones ask for more than 10 minutes. nginx must wait
		# longer, or it ends the request with 504 while Z-Push still waits
		# (B129). 3660 s as in Z-Push's own nginx example.
		fastcgi_read_timeout 3660;
		fastcgi_pass php-fpm;

		# Outgoing mail also goes through this endpoint, so increase the maximum
		# file upload limit to match the corresponding Postfix limit.
		client_max_body_size 128M;
	}
	location ~* ^/autodiscover/autodiscover.xml$ {
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME /usr/local/lib/z-push/autodiscover/autodiscover.php;
		fastcgi_param PHP_VALUE "include_path=.:/usr/share/php:/usr/share/pear:/usr/share/awl/inc";
		fastcgi_pass php-fpm;
	}


	# ADDITIONAL DIRECTIVES HERE

	# Disable viewing dotfiles (.htaccess, .svn, .git, etc.)
	# This block is placed at the end. Nginx's precedence rules means this block
	# takes precedence over all non-regex matches and only regex matches that
	# come after it (i.e. none of those, since this is the last one.) That means
	# we're blocking dotfiles in the static hosted sites but not the FastCGI-
	# handled locations for Nextcloud (which serves user-uploaded files that might
	# have this pattern, see #414) or some of the other services.
	location ~ /\.(ht|svn|git|hg|bzr) {
		log_not_found off;
		access_log off;
		deny all;
	}
